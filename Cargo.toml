[package]
name = "graft"
version = "0.2.1"
edition = "2024"
description = "Inject your environment into any container; a lightweight devcontainer runner."
license = "MIT"
readme = "README.md"
keywords = ["devcontainer", "docker", "container", "patchelf"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json_comments = "0.2"
toml = "0.8"
anyhow = "1"
dirs = "5"
