name: release-plz

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Bump version + changelog from conventional commits and commit straight to
      # master. No release PR. [skip ci] keeps this commit from re-triggering CI.
      - name: Bump version & changelog
        run: release-plz update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & push bump
        run: |
          if ! git diff --quiet; then
            git commit -am "chore: release [skip ci]"
            git push
          fi
      # Tag the (now bumped) version and publish the GitHub release, which
      # triggers release.yml to build and attach the binaries.
      - name: Release
        run: release-plz release --git-token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
