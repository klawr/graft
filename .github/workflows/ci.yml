name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default; the release jobs opt into write access individually.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # Cut a release only after `check` passes, and only for pushes to master.
  # `needs: check` is the dependency, so a red tree (fmt/clippy/test/build) can
  # never be tagged. On pull requests this job is skipped by the `if`.
  #
  # Versioning is derived entirely from conventional commits and `v*` git tags
  # via git-cliff
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Empty unless a new version was actually released this run.
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Next version from conventional commits since the last `v*` tag.
          # `--bumped-version` returns the current version unchanged when no
          # commit warrants a release, so an equal value means "nothing to do".
          latest="$(git tag --sort=-v:refname | head -n1 || true)"
          next="v$(git cliff --bumped-version | sed 's/^v//')"
          if [ "$next" = "$latest" ]; then
            echo "No releasable changes since ${latest:-the beginning}; nothing to do."
            exit 0
          fi
          echo "Releasing $next (previous: ${latest:-none})"

          # Bump the version in Cargo.toml + Cargo.lock in place — no Rust
          # toolchain needed, which keeps this job lean.
          ver="${next#v}"
          ver="$ver" perl -0pi -e 's/(\[package\][^\[]*?\nversion = ")[^"]+(")/$1$ENV{ver}$2/' Cargo.toml
          ver="$ver" perl -0pi -e 's/(name = "graft"\nversion = ")[^"]+(")/$1$ENV{ver}$2/' Cargo.lock

          # Regenerate the changelog including the new version.
          git cliff --bump -o CHANGELOG.md

          # Commit + tag straight to master ([skip ci] avoids re-triggering).
          git add -A
          git commit -m "chore: release $next [skip ci]"
          git tag "$next"
          git push origin HEAD:master
          git push origin "$next"

          # GitHub release with notes for just this version.
          git cliff --latest --strip header > RELEASE_NOTES.md
          gh release create "$next" --title "$next" --notes-file RELEASE_NOTES.md --verify-tag

          echo "tag=$next" >> "$GITHUB_OUTPUT"

  # Build static musl binaries for x86_64 and aarch64 and attach them as
  # .tar.gz assets to the release that was just published.
  upload:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: graft
          target: ${{ matrix.target }}
          archive: graft-$target
          ref: refs/tags/${{ needs.release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
