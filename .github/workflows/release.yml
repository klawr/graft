name: release

# Tag a version to build the binaries and publish a GitHub release that
# install.sh can download:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      # Builds a static musl binary (cross-compiling aarch64) and uploads a
      # `graft-<target>.tar.gz` asset to the release. graft has no C deps, so
      # musl-static just works.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: graft
          target: ${{ matrix.target }}
          archive: graft-$target
          token: ${{ secrets.GITHUB_TOKEN }}
