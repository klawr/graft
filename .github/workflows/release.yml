name: release

# Triggered when a release is published on GitHub. Builds static musl binaries
# for x86_64 and aarch64 and attaches them as .tar.gz assets.
# To ship: create a release on GitHub tagged vX.Y.Z — CI does the rest.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: graft
          target: ${{ matrix.target }}
          archive: graft-$target
          token: ${{ secrets.GITHUB_TOKEN }}
